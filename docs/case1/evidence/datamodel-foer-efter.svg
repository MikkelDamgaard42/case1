<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#f5f3ec"/><style>text{font-family:Arial,sans-serif;fill:#173d33}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52665e}.head{font-size:23px;font-weight:700}.field{font-size:19px}.note{font-size:17px;fill:#52665e}.box{fill:#fff;stroke:#a8bbb0;stroke-width:2}.line{fill:none;stroke:#23654e;stroke-width:3}</style><text x="60" y="65" class="title">Mellemrum · datamodel før og efter</text><text x="60" y="100" class="sub">Fra gentagne oplysninger til relationer mellem sted, event og tilmelding</text><path d="M680 150V740" stroke="#cbd3ca"/><text x="60" y="165" class="head">FØR · startprojekt</text><text x="740" y="165" class="head">EFTER · forbedret model</text><rect class="box" x="60" y="195" width="560" height="250" rx="8"/><text class="head" x="82" y="231">events</text><path d="M60 249H620" stroke="#d3ddd4"/><text class="field" x="82" y="281">id · title · date · …</text><text class="field" x="82" y="310">venueName · venueAddress</text><text class="field" x="82" y="339">venuePostalCode · venueCity</text><text class="field" x="82" y="368">venueWebsite</text><rect class="box" x="60" y="480" width="560" height="195" rx="8"/><text class="head" x="82" y="516">registrations</text><path d="M60 534H620" stroke="#d3ddd4"/><text class="field" x="82" y="566">id · name · email · status · …</text><text class="field" x="82" y="595">eventTitle · eventDate</text><text class="field" x="82" y="624">eventLocation</text><rect class="box" x="740" y="195" width="590" height="140" rx="8"/><text class="head" x="762" y="231">venues</text><path d="M740 249H1330" stroke="#d3ddd4"/><text class="field" x="762" y="281">id (primærnøgle)</text><text class="field" x="762" y="310">name · address · postalCode · city · website</text><rect class="box" x="740" y="390" width="590" height="140" rx="8"/><text class="head" x="762" y="426">events</text><path d="M740 444H1330" stroke="#d3ddd4"/><text class="field" x="762" y="476">id (primærnøgle) · title · date · …</text><text class="field" x="762" y="505">venueId → venues.id · valgfrit</text><rect class="box" x="740" y="585" width="590" height="140" rx="8"/><text class="head" x="762" y="621">registrations</text><path d="M740 639H1330" stroke="#d3ddd4"/><text class="field" x="762" y="671">id (primærnøgle) · name · email · status · …</text><text class="field" x="762" y="700">eventId → events.id · obligatorisk</text><path class="line" d="M1035 335V390M1027 343L1035 335L1043 343M1035 530V585M1027 538L1035 530L1043 538"/><text class="note" x="1055" y="369">Ét venue → flere events</text><text class="note" x="1055" y="564">Ét event → flere tilmeldinger</text><text class="note" x="60" y="720">Ingen relation mellem tabellerne.</text><text class="note" x="60" y="750">Venue- og eventdata gentages.</text><text class="note" x="740" y="765">Kopifelterne er fjernet. Fremmednøgler forbinder data.</text><text class="note" x="60" y="800">Forenklet skema · før: udleveret SQL · efter: verificeret i Supabase 15.10.2026</text></svg>